name: browninote
description: "BrownieNote - Tu cuaderno escolar inteligente con notas, tareas y calendario"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  intl: ^0.20.0
  table_calendar: ^3.1.2
  uuid: ^4.5.1
  provider: ^6.1.2
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  pasteboard: ^0.5.0
  crop_your_image: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
